version: '3.8'

services:
  # Spring Boot 애플리케이션
  app:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/civil-bridge:dev
    container_name: civil-bridge-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    depends_on:
      - mysql
      - redis
    restart: unless-stopped
    networks:
      - app-network

  # MySQL DB
  mysql:
    image: mysql:8.0
    container_name: civil-bridge-mysql
    ports:
      - "3306:3306" # 외부에서 DB에 접속할 수 있도록 포트 매핑
    environment:
      MYSQL_USER: ${DB_USERNAME} # app 서비스에서 사용할 DB 사용자 이름
      MYSQL_PASSWORD: ${DB_PASSWORD} # app 서비스에서 사용할 DB 비밀번호
      MYSQL_DATABASE: ${DB_NAME} # app 서비스에서 사용할 데이터베이스 이름
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD} # root 비밀번호
    volumes:
      - mysql-data:/var/lib/mysql # 데이터 영속성을 위한 볼륨 설정
    restart: unless-stopped
    networks:
      - app-network

  # Redis
  redis:
    image: redis:7.4-alpine
    container_name: civil-bridge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - app-network

volumes:
  mysql-data:
  redis-data:

networks:
  app-network:
    driver: bridge